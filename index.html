<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombie Bite Night</title>
<meta name="description" content="Zombie Bite Night: the game where you rescue everybody from the zombies! A spooky, silly escape from school, home, the zoo, the mall and the park.">
<meta name="theme-color" content="#1A1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bite Night">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#D9D2E6; --ink:#1A1426; --slime:#7BD84A; --slime-d:#4E9A2A; --blood:#E5432D; --gold:#F2C230; --panel:#241B36; --panel2:#2F2445; --fg:#F3EEFA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0C0912; } }
:root[data-theme="dark"]{ --bg:#0C0912; }
*,*::before,*::after{box-sizing:inherit}
html,body{overscroll-behavior:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--fg);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#0E0A16}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:8px;left:8px;right:8px;z-index:3;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#panel{flex:1;min-width:0;background:linear-gradient(rgba(52,38,78,.94),rgba(36,27,54,.94));border:3px solid #000;border-radius:14px;padding:7px 10px 8px;box-shadow:0 3px 0 #000,inset 0 2px 0 rgba(255,255,255,.08)}
#panel .r1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
#lvname{font:17px/1 "Lilita One",Impact,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font:800 13px Nunito,sans-serif;color:#B9AED0;font-variant-numeric:tabular-nums;white-space:nowrap}
#panel .r2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
#hearts{display:flex;gap:3px}
#hearts i{width:14px;height:13px;display:inline-block;background:#4A3D63;clip-path:path('M7 13 L1 7 A3.4 3.4 0 0 1 7 2 A3.4 3.4 0 0 1 13 7 Z')}
#hearts i.on{background:var(--blood);filter:drop-shadow(0 0 3px rgba(229,67,45,.7))}
#left{font:800 13px Nunito,sans-serif;color:var(--slime);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#ammo{font:800 13px Nunito,sans-serif;color:var(--gold);white-space:nowrap}
#ammo.low{color:var(--blood);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.5}}
.hbtn{pointer-events:auto;width:44px;height:44px;background:linear-gradient(rgba(52,38,78,.94),rgba(36,27,54,.94));border:3px solid #000;border-radius:14px;box-shadow:0 3px 0 #000;color:var(--fg);font:19px/1 system-ui,sans-serif;cursor:pointer;padding:0}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
#mini{position:absolute;right:8px;top:72px;z-index:3;width:104px;height:88px;border:3px solid #000;border-radius:10px;background:rgba(14,10,22,.85);pointer-events:none}
#wpn{position:absolute;right:12px;bottom:96px;z-index:4;width:58px;height:58px;border-radius:50%;background:rgba(36,27,54,.92);border:3px solid #000;box-shadow:0 3px 0 #000;font:26px/1 system-ui,sans-serif;cursor:pointer;padding:0}
#wpn:active{transform:translateY(2px)}
#wpn::after{content:'SWAP';position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font:800 9px Nunito,sans-serif;color:#B9AED0}
#powers{position:absolute;left:8px;top:72px;z-index:3;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#powers div{display:flex;align-items:center;gap:6px;background:rgba(36,27,54,.9);border:2px solid #000;border-radius:10px;padding:3px 8px 3px 4px;font:800 12px Nunito,sans-serif}
#powers b{font-size:16px}
#powers i{display:block;height:4px;border-radius:2px;margin-top:2px;font-style:normal}
#bossbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;width:76%;background:rgba(36,27,54,.92);border:3px solid #000;border-radius:12px;padding:6px 10px 8px;text-align:center;pointer-events:none}
#bossbar b{display:block;font:15px Creepster,Impact,sans-serif;letter-spacing:1px;color:#FF8A7A;margin-bottom:4px}
#bossbar span{display:block;height:10px;background:#4A3D63;border-radius:5px;overflow:hidden;border:2px solid #000}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#E5432D,#F2C230);transition:width .2s}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;pointer-events:none;width:88%;font:800 14px/1.4 Nunito,sans-serif;color:#fff;
  background:rgba(36,27,54,.92);border:3px solid #000;border-radius:14px;padding:10px 14px;text-align:center;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
.joy{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .15s}
.joy.on{opacity:1}
.joy .base{position:absolute;width:104px;height:104px;left:-52px;top:-52px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.35)}
.joy .knob{position:absolute;width:48px;height:48px;left:-24px;top:-24px;border-radius:50%;background:#8FA0C0;border:3px solid #000;box-shadow:0 3px 0 #000}
#joy2 .base{background:rgba(242,194,48,.1);border-color:rgba(242,194,48,.55)}
#joy2 .knob{background:var(--gold)}
#overlay{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,5,14,.6)}
#overlay.hidden{display:none}
.card{background:radial-gradient(120% 70% at 50% 0%,#3D2B62 0%,var(--panel) 62%);border:4px solid #000;border-radius:22px;box-shadow:0 8px 0 #000,0 0 50px rgba(242,140,40,.12),inset 0 2px 0 rgba(255,255,255,.07);width:100%;max-width:370px;padding:22px 18px 18px;text-align:center;max-height:100%;overflow:auto}
.card h1{font:52px/.95 Creepster,Impact,sans-serif;color:var(--slime);margin:4px 0 12px;letter-spacing:2px;text-shadow:0 4px 0 #000,0 0 24px rgba(123,216,74,.35)}
.card h1 span{display:block;color:#F28C28;font-size:38px;text-shadow:0 4px 0 #000,0 0 22px rgba(242,140,40,.35)}
.tag{font:16px "Lilita One",Impact,sans-serif!important;color:#FFE27A!important;margin:-4px 0 6px!important;letter-spacing:.3px}
.deco{display:flex;justify-content:center;gap:18px;font-size:22px;margin-top:-4px}
.deco span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.deco span:nth-child(2){animation-delay:-.8s;font-size:26px}.deco span:nth-child(3){animation-delay:-1.6s;transform:scaleX(-1)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@media (prefers-reduced-motion: reduce){.deco span{animation:none}}
.card h2{font:40px/1 Creepster,Impact,sans-serif;color:var(--slime);margin:0 0 8px;letter-spacing:1px;text-shadow:0 3px 0 #000}
.card h2.bad{color:var(--blood)}
.card p{font-size:15px;line-height:1.5;margin:8px 0;color:#D6CDE6}
.card .small{font-size:13px;opacity:.8}
.big{font:40px/1 "Lilita One",Impact,sans-serif;margin:6px 0}
.stars{font-size:42px;letter-spacing:6px;margin:4px 0}
.stars i{font-style:normal;color:#4A3D63}
.stars i.on{color:var(--gold);animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars i.on:nth-child(2){animation-delay:.15s}.stars i.on:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.btn{display:inline-block;margin:12px 4px 0;font:20px "Lilita One",Impact,sans-serif;background:linear-gradient(#93EC62,#62C23A);color:var(--ink);border:3px solid #000;border-radius:14px;box-shadow:0 4px 0 #000;padding:11px 20px;cursor:pointer}
.btn.alt{background:linear-gradient(#3A2E55,#2A2142);color:var(--fg)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn:focus-visible,.lv:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:10px 0 4px;font-size:12px;font-weight:800;color:#D6CDE6}
.howto div{background:var(--panel2);border:2px solid #000;border-radius:12px;padding:8px 4px}
.howto b{display:block;font-size:22px;margin-bottom:3px}
.hero{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 2px;font:800 13px Nunito,sans-serif;color:#D6CDE6}
.hb{font:18px "Lilita One",Impact,sans-serif;background:var(--panel2);color:var(--fg);border:3px solid #000;border-radius:12px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #000}
.hb.on{background:var(--slime);color:var(--ink)}
.hb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lvgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 6px}
.lv{background:linear-gradient(#3A2E55,#2A2142);border:3px solid #000;border-radius:14px;box-shadow:0 3px 0 #000,inset 0 2px 0 rgba(255,255,255,.07);color:var(--fg);padding:9px 4px 7px;font:22px "Lilita One",Impact,sans-serif;cursor:pointer;transition:transform .12s,box-shadow .12s}
.lv:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 5px 0 #000,0 0 14px rgba(242,140,40,.25),inset 0 2px 0 rgba(255,255,255,.07)}
.lv small{display:block;font-size:13px;color:var(--gold);letter-spacing:1px;margin-top:2px}
.lv em{display:block;font:800 10px Nunito,sans-serif;font-style:normal;color:#B9AED0;margin-top:2px}
.lv[disabled]{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="panel">
      <div class="r1"><span id="lvname">Zombies</span><span id="timer">0:00</span></div>
      <div class="r2"><span id="hearts"></span><span id="left">🧟 0 left</span><span id="ammo">● 0</span></div>
    </div>
    <button class="hbtn" id="retry" aria-label="Restart">↻</button>
    <button class="hbtn" id="menu" aria-label="Menu">☰</button>
  </div>
  <canvas id="mini" width="208" height="176"></canvas>
  <button id="wpn" aria-label="Switch weapon" style="display:none">🔫</button>
  <div id="powers"></div>
  <div id="bossbar" style="display:none"><b>BOSS</b><span><i></i></span></div>
  <div id="hint"></div>
  <div id="joy" class="joy"><div class="base"></div><div class="knob"></div></div>
  <div id="joy2" class="joy"><div class="base"></div><div class="knob"></div></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>
<script>window.__isPWA = true;</script>
<script>
(() => {
/* =====================================================================
   MAPS
   Each map is a one-way trip, like a haunted house: you start at one end
   and fight room by room to the exit. Numbered tiles are locked doors that
   open when the room before them is cleared. '^' is the exit.
   floors:  . hall  , wood  l lab tile  c cafeteria  g gym  r library carpet  k lounge carpet
            t locker-room tile  o office rug  A asphalt  C concrete  G grass  E end zone  R track  M mulch
   objects: # wall  D desk  W teacher's desk  T table  S shelf  B bleachers  L lockers  b bench  K couch
            V vending machine (breakable)  F counter  X lab bench  e easel  P piano  h chair  Z cot  p plant
            Q car  U bus  O light pole  H fence  Y goalpost  N scoreboard  y tree  % barrel (explodes)  u toilet
   ===================================================================== */
const TS = 32;
const SOLID = new Set('#DWTSBLbKVFXePhZpQUOHYNy%u123456789^&~jn'.split(''));
const BULLET_SOLID = new Set('#SVFQULONyP%123456789^&'.split(''));
const OBJECT_GROUPS = new Set('WTSBLbKFXPZQUN&'.split(''));
let MW, MH, grid, MAP, EXIT_OPEN = false;

function blankMap(w, h, fill) { MW = w; MH = h; return [...Array(h)].map(() => Array(w).fill(fill)); }
function mk(g) {
  const rect = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (y >= 0 && x >= 0 && y < g.length && x < g[0].length) g[y][x] = c; };
  const put = (x, y, c) => { g[y][x] = c; };
  return { rect, put };
}

function buildSchoolMap() {
  // a 3x4 grid of rooms. The route winds: up, right, down, right, up, up, left, left, then out.
  const g = blankMap(34, 53, '#'), { rect, put } = mk(g);
  // row 3 (bottom): lobby, principal's office, nurse
  rect(1, 40, 10, 51, '.'); rect(12, 40, 21, 51, 'o'); rect(23, 40, 32, 51, 'l');
  // row 2: main hallway, room 101, teachers' lounge
  rect(1, 27, 10, 38, '.'); rect(12, 27, 21, 38, ','); rect(23, 27, 32, 38, 'k');
  // rows 0-1 (top, double height): cafeteria, the big library, chemistry lab
  rect(1, 1, 10, 25, 'c'); rect(12, 1, 21, 25, 'r'); rect(23, 1, 32, 25, 'l');
  // the doors, in the order you go through them
  rect(4, 39, 6, 39, '1');      // lobby -> hallway (up)
  rect(11, 31, 11, 33, '2');    // hallway -> room 101 (right)
  rect(15, 39, 17, 39, '3');    // room 101 -> principal's office (down)
  rect(22, 44, 22, 46, '4');    // principal -> nurse (right)
  rect(26, 39, 28, 39, '5');    // nurse -> lounge (up)
  rect(26, 26, 28, 26, '6');    // lounge -> chemistry lab (up)
  rect(22, 4, 22, 6, '7');      // chemistry -> library (left)
  rect(11, 19, 11, 21, '8');    // library -> cafeteria (left)
  rect(3, 0, 5, 0, '^');        // cafeteria -> out to the locker room hall
  // lobby
  rect(1, 40, 3, 40, 'S'); rect(8, 40, 10, 40, 'S'); rect(2, 48, 4, 48, 'b'); rect(7, 48, 9, 48, 'b'); put(1, 51, 'p'); put(10, 51, 'p');
  // main hallway: lockers down one side
  rect(1, 28, 1, 37, 'L'); put(10, 28, 'V'); put(10, 37, 'p');
  // room 101
  for (const y of [29, 32, 35]) for (const x of [13, 15, 17, 19]) put(x, y, 'D');
  rect(19, 37, 20, 37, 'W');
  // principal's office
  rect(14, 43, 16, 43, 'W'); rect(19, 40, 21, 40, 'S'); put(12, 51, 'p'); put(21, 51, 'p'); rect(13, 48, 15, 48, 'K');
  // nurse
  for (const x of [24, 30]) rect(x, 42, x, 43, 'Z');
  for (const x of [24, 27, 30]) rect(x, 47, x, 48, 'Z');
  put(32, 51, 'V');
  // teachers' lounge
  rect(24, 30, 25, 30, 'K'); rect(30, 30, 31, 30, 'K'); rect(27, 33, 28, 34, 'T'); rect(29, 38, 32, 38, 'F'); put(32, 34, 'V'); put(23, 27, 'p');
  // chemistry lab
  for (const y of [4, 8, 12, 16, 20]) { rect(24, y, 27, y, 'X'); rect(29, y, 32, y, 'X'); }
  for (const [x, y] of [[28, 6], [25, 10], [31, 14], [28, 18], [24, 23]]) put(x, y, '%');
  // the big library: two rows of stacks and a reading area
  for (const x of [13, 15, 17, 19]) { rect(x, 3, x, 10, 'S'); rect(x, 15, x, 23, 'S'); }
  rect(15, 12, 18, 13, 'T'); put(21, 1, 'p'); put(12, 25, 'p');
  // cafeteria
  rect(2, 4, 8, 4, 'F');
  for (const y of [8, 12, 16, 20, 24]) { rect(2, y, 4, y, 'T'); rect(6, y, 8, y, 'T'); }
  put(10, 10, 'V'); put(1, 14, 'V');
  return { id: 'school', name: 'The School', grid: g, start: [5, 50], dark: 0.86, lights: [], indoor: true, boss: ['janitor'],
    zones: [
      { name: 'FRONT LOBBY', zombies: { walker: 3 } },
      { name: 'MAIN HALLWAY', zombies: { walker: 4, runner: 1 }, survivors: [[9, 37]], pickups: [['ammo', 5, 30]] },
      { name: 'ROOM 101', zombies: { walker: 5 }, survivors: [[12, 28]], features: [['alarm', 21, 30]] },
      { name: "PRINCIPAL'S OFFICE", zombies: { walker: 3, runner: 2 }, pickups: [['health', 20, 50], ['ammo', 13, 50]] },
      { name: "NURSE'S OFFICE", zombies: { walker: 4, nerd: 1 }, survivors: [[32, 45]], pickups: [['health', 26, 44]] },
      { name: "TEACHERS' LOUNGE", zombies: { walker: 4, runner: 2 }, pickups: [['ammo', 32, 37]], features: [['alarm', 23, 35]] },
      { name: 'CHEMISTRY LAB', zombies: { walker: 6, runner: 2 }, survivors: [[32, 1]], weapon: ['extinguisher', 28, 22], features: [['alarm', 32, 10]] },
      { name: 'THE LIBRARY', zombies: { walker: 5, nerd: 4, runner: 2 }, survivors: [[12, 1]], pickups: [['health', 16, 14]], features: [['switch', 21, 12]], powers: [[16, 11]] },
      { name: 'CAFETERIA', zombies: { walker: 4, runner: 2 }, pickups: [['ammo', 9, 22], ['health', 1, 1], ['health', 10, 1]] }
    ] };
}

function buildGymMap() {
  const g = blankMap(26, 80, '#'), { rect, put } = mk(g);
  // 4: gym lobby + coach's office (boss)
  rect(1, 1, 24, 13, '.'); rect(11, 0, 13, 0, '^');
  rect(2, 2, 6, 2, 'S'); rect(19, 2, 23, 2, 'S');
  rect(1, 6, 8, 6, '#'); rect(8, 7, 8, 12, '#'); rect(1, 7, 7, 12, 'o'); put(8, 10, 'o'); rect(3, 8, 4, 8, 'W'); put(1, 7, 'p');
  rect(20, 14, 22, 14, '4');
  // 3: the gym
  rect(1, 15, 24, 38, 'g'); rect(1, 18, 3, 25, 'B'); rect(1, 28, 3, 35, 'B'); put(24, 20, 'V'); put(24, 31, 'V');
  rect(21, 16, 22, 16, 'T');
  rect(2, 39, 4, 39, '3');
  // 2: restroom stalls
  rect(1, 40, 24, 50, 'l');
  for (const x of [4, 7, 10, 13]) rect(x, 41, x, 44, '#');
  for (const x of [5, 8, 11]) put(x, 41, 'u');
  rect(16, 49, 22, 49, 'F');
  rect(11, 51, 13, 51, '2');
  // 1: showers
  rect(1, 52, 24, 64, 't');
  for (const y of [54, 57, 60]) rect(1, y, 4, y, '#');
  for (const y of [55, 58, 61]) rect(21, y, 24, y, '#');
  rect(11, 65, 13, 65, '1');
  // 0: locker room
  rect(1, 66, 24, 78, 't');
  for (const y of [68, 72, 76]) { rect(3, y, 9, y, 'L'); rect(15, y, 21, y, 'L'); }
  for (const y of [70, 74]) { rect(4, y, 8, y, 'b'); rect(16, y, 20, y, 'b'); }
  return { id: 'gym', name: 'Locker Room & Gym', grid: g, start: [12, 77], dark: 0.85, lights: [], indoor: true, boss: ['coach'],
    zones: [
      { name: 'LOCKER ROOM', zombies: { walker: 4 }, survivors: [[23, 67]], pickups: [['ammo', 12, 67]] },
      { name: 'SHOWERS', zombies: { walker: 3 }, spawns: [['crawler', 2, 55], ['crawler', 2, 58], ['crawler', 23, 56], ['crawler', 23, 59]], survivors: [[23, 63]], features: [['switch', 1, 63]] },
      { name: 'RESTROOMS', zombies: { walker: 4, runner: 2 }, spawns: [['crawler', 6, 43], ['crawler', 9, 43], ['crawler', 12, 43]], survivors: [[2, 43]], features: [['alarm', 24, 45]] },
      { name: 'THE GYM', zombies: { walker: 6, brute: 3, runner: 3, nerd: 2 }, survivors: [[2, 26]], weapon: ['dodgeball', 13, 27], pickups: [['ammo', 20, 36]], powers: [[13, 20]], features: [['switch', 24, 37]] },
      { name: "COACH'S OFFICE", zombies: { walker: 3, runner: 1 }, survivors: [[2, 11]], pickups: [['health', 23, 12]] }
    ] };
}

function buildFieldMap() {
  const g = blankMap(30, 78, 'G'), { rect, put } = mk(g);
  rect(0, 0, 29, 0, 'H'); rect(0, 77, 29, 77, 'H'); rect(0, 0, 0, 77, 'H'); rect(29, 0, 29, 77, 'H');
  rect(1, 1, 28, 76, 'R'); rect(3, 3, 26, 74, 'G'); rect(3, 3, 26, 7, 'E'); rect(3, 70, 26, 74, 'E');
  rect(13, 0, 16, 0, '^');
  // 3: north end: concession stand, bleachers, scoreboard (boss)
  rect(2, 2, 8, 8, '#'); rect(3, 3, 7, 7, 'C'); put(8, 5, 'C'); put(8, 6, 'C'); rect(3, 3, 5, 3, 'F'); put(7, 3, 'V');
  rect(22, 9, 27, 15, 'B'); rect(19, 1, 25, 1, 'N'); put(13, 2, 'Y'); put(16, 2, 'Y');
  rect(1, 20, 28, 20, '3');
  // 2: midfield
  rect(8, 27, 9, 27, 'T'); rect(20, 33, 21, 33, 'T'); rect(11, 30, 13, 30, 'b'); rect(16, 24, 18, 24, 'b');
  rect(1, 40, 28, 40, '2');
  // 1: south half
  rect(4, 48, 7, 48, 'b'); rect(22, 48, 25, 48, 'b'); rect(4, 54, 7, 54, 'b'); put(26, 50, 'T');
